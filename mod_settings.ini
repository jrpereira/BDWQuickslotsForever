[Setting.SwapAbilitiesWithConsumables]
Id = SwapAbilitiesWithConsumables
Type = toggle
Label = Swap Abilities with Consumables
Description = Exchanges wheel ownership of the position controls: Abilities X/Y moves the Consumables wheel, and Consumables X/Y moves the Abilities wheel.
Group = Wheels
GroupStyle = subsection
ConfigFile = config.ini
ConfigSection = Position Modifiers
ConfigKey = SwapAbilitiesWithConsumables
PresetValues = 0|1
PresetLabels = Off|On
Default = 0

[Setting.Preset]
Id = Preset
Type = picker
Label = Configuration preset
Description = Selecting a preset updates the bindings below immediately in memory. Nothing is written until Apply. Any binding or Tap/Hold change that no longer matches a preset switches this row to Custom.
Group = Control Overrides
