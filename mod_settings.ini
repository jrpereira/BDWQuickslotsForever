[Mod]
Id = QuickslotsForever
Name = QuickslotsForever
Version = 0.3.53
Description = Persistent ability and consumable actions with native Tap/Hold input, native wheel indicators, fixed inventory assignment keys and reversible conflicting-action suppression.
[Setting.Enabled]
Id = Enabled
Type = toggle
Label = Enabled QuickslotsForever
Description = Master switch for QuickslotsForever gameplay shortcuts.
Group = General Settings
ConfigFile = config.ini
ConfigSection = General
ConfigKey = Enabled
PresetValues = 0|1
PresetLabels = Off|On
Default = 1

[Setting.HoldThresholdMs]
Id = HoldThresholdMs
Type = integer
Label = Hold vs Tap threshold
Description = Press duration in milliseconds at which Enhanced Input classifies a press as Hold instead of Tap.
Group = General Settings
ConfigFile = config.ini
ConfigSection = General
ConfigKey = HoldThresholdMs
Minimum = 50
Maximum = 1000
Step = 25
Suffix = ms
Default = 200

[Setting.RemoveDefinedActionBindings]
Id = RemoveDefinedActionBindings
Type = toggle
Label = Disable Bindings for conflicting actions
Description = Quickslot shortcuts and wheel swap
Group = General Settings
ConfigFile = config.ini
ConfigSection = General
ConfigKey = RemoveDefinedActionBindings
PresetValues = 0|1
PresetLabels = Off|On
Default = 1

[Setting.ShowBothWheels]
Id = ShowBothWheels
Type = toggle
Label = Show both Abilities and Consumables shortcut wheels
Description = Shows both shortcut wheels together. When off, the game shows one wheel at a time with its native swap icon/key; configured shortcuts still work.
Group = General Settings
ConfigFile = config.ini
ConfigSection = General
ConfigKey = ShowBothWheels
PresetValues = 0|1
PresetLabels = Off|On
Default = 1

[Category.Wheels]
VisibleWhen = ShowBothWheels
VisibleValues = 1

