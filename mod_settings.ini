[Mod]
Id = QuickslotsForever
Name = QuickslotsForever
Version = 0.3.65
Description = Persistent ability and consumable actions with native Tap/Hold input, native wheel indicators, fixed inventory assignment keys and reversible conflicting-action suppression.

